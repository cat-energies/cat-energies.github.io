name: Corriger badge guide EDF SA
on:
  push:
    paths:
      - '.github/workflows/remove-fr-guide-edf.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retirer le drapeau FR du badge national
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("edf/guides/2026 - Guide_Rentree_2026_CAT_Energies_EDF_SA.html")
          s=p.read_text(encoding="utf-8")
          old='<div class="national-scope-badge">🇫🇷 Périmètre national · EDF SA</div>'
          new='<div class="national-scope-badge">Périmètre national · EDF SA</div>'
          if old not in s:
              raise SystemExit("Badge cible non trouve")
          p.write_text(s.replace(old,new,1), encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "cat-energies-cattenom"
          git config user.email "cat-energies-cattenom@edf.fr"
          git add "edf/guides/2026 - Guide_Rentree_2026_CAT_Energies_EDF_SA.html"
          git commit -m "Retirer le drapeau FR du badge du guide EDF SA"
          git push
