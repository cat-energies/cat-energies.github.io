name: Migrate Cattenom content exactly

on:
  push:
    paths:
      - '.github/workflows/migrate-cattenom-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Clone historical repositories
        run: |
          git clone --depth 1 https://github.com/cat-energies-cattenom/adhesion.git /tmp/cat-adhesion
          git clone --depth 1 https://github.com/cat-energies-cattenom/guides.git /tmp/cat-guides
          git clone --depth 1 https://github.com/cat-energies-cattenom/communiques.git /tmp/cat-communiques

      - name: Copy original files byte for byte
        run: |
          mkdir -p edf/dpn/cattenom/adhesion
          mkdir -p edf/dpn/cattenom/guides
          mkdir -p edf/dpn/cattenom/communiques
          cp "/tmp/cat-adhesion/Bulletin d'adhésion_Cattenom.html" "edf/dpn/cattenom/adhesion/Bulletin d'adhésion_Cattenom.html"
          cp "/tmp/cat-guides/Guide de la rentrée - 2026.html" "edf/dpn/cattenom/guides/Guide de la rentrée - 2026.html"
          cp "/tmp/cat-communiques/08 - Présentation de la section CAT_Energies_Cattenom.html" "edf/dpn/cattenom/communiques/08 - Présentation de la section CAT_Energies_Cattenom.html"
          cp "/tmp/cat-communiques/09 - 15 sept _ tarif agent - contenu.html" "edf/dpn/cattenom/communiques/09 - 15 sept _ tarif agent - contenu.html"
          cp "/tmp/cat-communiques/09 - 15 sept _ tarif agent.html" "edf/dpn/cattenom/communiques/09 - 15 sept _ tarif agent.html"
          cp "/tmp/cat-communiques/09 - Origines CAT Energies.html" "edf/dpn/cattenom/communiques/09 - Origines CAT Energies.html"
          cp "/tmp/cat-communiques/modalites-greve-PGI-GTA-Cattenom.pdf" "edf/dpn/cattenom/communiques/modalites-greve-PGI-GTA-Cattenom.pdf"

      - name: Verify exact Git blob hashes
        run: |
          test "$(git hash-object "edf/dpn/cattenom/adhesion/Bulletin d'adhésion_Cattenom.html")" = "b67a11e2e7af038effd2daf7a83c85dbcb13f002"
          test "$(git hash-object "edf/dpn/cattenom/guides/Guide de la rentrée - 2026.html")" = "3abc56100dae7e248f483c4bc9c10d592e90dc33"
          test "$(git hash-object "edf/dpn/cattenom/communiques/08 - Présentation de la section CAT_Energies_Cattenom.html")" = "ab06390e92297dc6c9e9817bbe2d873ef723d5f0"
          test "$(git hash-object "edf/dpn/cattenom/communiques/09 - 15 sept _ tarif agent - contenu.html")" = "812af9062d01bfee38c2e3ae2dcdc18c51876370"
          test "$(git hash-object "edf/dpn/cattenom/communiques/09 - 15 sept _ tarif agent.html")" = "2a93a8c796628692df9031acd7d2c19512369658"
          test "$(git hash-object "edf/dpn/cattenom/communiques/09 - Origines CAT Energies.html")" = "facdc678c3809df578d4419d59f92dd0246eeb3e"
          test "$(git hash-object "edf/dpn/cattenom/communiques/modalites-greve-PGI-GTA-Cattenom.pdf")" = "8f2155e0fc9d9506951d1c9827aaefb5dc934021"

      - name: Commit migrated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edf/dpn/cattenom/adhesion edf/dpn/cattenom/guides edf/dpn/cattenom/communiques
          if git diff --cached --quiet; then
            echo 'No content changes required'
          else
            git commit -m 'Migrer strictement les contenus Cattenom historiques'
            git push
          fi
