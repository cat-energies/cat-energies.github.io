name: Fix EDF portal contact
on:
  push:
    paths:
      - '.github/workflows/fix-edf-contact.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update EDF contact button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('edf/index.html')
          s = p.read_text(encoding='utf-8')
          s2, n1 = re.subn(r'href="mailto:cat-energies-cattenom@edf\.fr"', 'href="mailto:sebastien.jouffret@edf.fr"', s, count=1)
          s3, n2 = re.subn(r'>\s*✉\s*cat-energies-cattenom@edf\.fr\s*</a>', '>\n      ✉ Contact\n    </a>', s2, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Replacement mismatch: mailto={n1}, label={n2}')
          p.write_text(s3, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edf/index.html
          git commit -m 'Mettre à jour le contact du portail EDF'
          git push
