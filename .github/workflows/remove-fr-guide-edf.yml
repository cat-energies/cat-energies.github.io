name: Retirer FR du guide EDF SA
on:
  push:
    paths:
      - '.github/workflows/remove-fr-guide-edf.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retirer FR devant le perimetre national
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("edf/guides/2026 - Guide_Rentree_2026_CAT_Energies_EDF_SA.html")
          s = p.read_text(encoding="utf-8")
          old = s
          patterns = [
              (r'FR\s+(?=PÉRIMÈTRE NATIONAL\s*[·•-]\s*EDF SA)', ''),
              (r'FR&nbsp;(?=PÉRIMÈTRE NATIONAL\s*[·•-]\s*EDF SA)', ''),
              (r'🇫🇷\s*(?=PÉRIMÈTRE NATIONAL\s*[·•-]\s*EDF SA)', ''),
              (r'>\s*FR\s*<(?=[^>]*>\s*PÉRIMÈTRE NATIONAL)', '><'),
          ]
          for pat, repl in patterns:
              s = re.sub(pat, repl, s)
          if s == old:
              raise SystemExit("Aucune occurrence cible trouvee")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "cat-energies-cattenom"
          git config user.email "cat-energies-cattenom@edf.fr"
          git add "edf/guides/2026 - Guide_Rentree_2026_CAT_Energies_EDF_SA.html"
          git commit -m "Retirer FR du badge perimetre national du guide EDF SA"
          git push
