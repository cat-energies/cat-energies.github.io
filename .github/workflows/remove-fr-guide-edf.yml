name: Inspecter badge guide EDF SA
on:
  push:
    paths:
      - '.github/workflows/remove-fr-guide-edf.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Afficher le contexte du badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("edf/guides/2026 - Guide_Rentree_2026_CAT_Energies_EDF_SA.html")
          s=p.read_text(encoding="utf-8")
          for needle in ["PÉRIMÈTRE", "PERIMETRE", "NATIONAL", "EDF SA"]:
              i=s.find(needle)
              print("NEEDLE", needle, "INDEX", i)
              if i>=0:
                  print(repr(s[max(0,i-300):i+500]))
          PY
