name: Harmoniser EDF SA
on:
  push:
    paths:
      - '.github/workflows/fix-edf-sa-everywhere.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining visible EDF labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('edf/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<div class="eyebrow">Portail CAT Énergies EDF</div>': '<div class="eyebrow">Portail CAT Énergies EDF SA</div>',
              '<footer>\n  CAT Énergies EDF\n</footer>': '<footer>\n  CAT Énergies EDF SA\n</footer>',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Mention attendue introuvable: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edf/index.html
          git commit -m 'Afficher EDF SA partout sur le portail EDF'
          git push
