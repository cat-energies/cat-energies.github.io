name: Create EDF communications portal

on:
  push:
    paths:
      - '.github/workflows/create-edf-portal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create EDF portal from Cattenom charter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          src = Path('edf/dpn/cattenom/index.html')
          dst = Path('edf/index.html')
          text = src.read_text(encoding='utf-8')

          # Keep the same visual charter and architecture, change only perimeter wording.
          replacements = {
              'CAT Énergies — Cattenom': 'CAT Énergies — EDF',
              'CAT Énergies - Cattenom': 'CAT Énergies - EDF',
              'CAT Énergies Cattenom': 'CAT Énergies EDF',
              'communications de la section CAT Énergies Cattenom': 'communications CAT Énergies pour le périmètre EDF',
              'Centre des communications': 'Centre des communications EDF',
          }
          for a, b in replacements.items():
              text = text.replace(a, b)

          # Point the portal to its own EDF-level data file.
          text = text.replace('communications.json', 'communications.json')

          # EDF starts with Guides pratiques only: hide the unused category tiles and quick links.
          text = re.sub(r'<button[^>]*class="category-tile"[^>]*data-cat="(?!Guides pratiques)[^"]+".*?</button>', '', text, flags=re.S)
          text = re.sub(r'<a[^>]*class="quick-link"[^>]*>.*?</a>', '', text, flags=re.S)

          # Update title/subtitle occurrences that explicitly mention Cattenom.
          text = text.replace('Portail des communications - CAT Énergies Cattenom', 'Portail des communications - CAT Énergies EDF')
          text = text.replace('Portail des communications Cattenom', 'Portail des communications EDF')
          text = text.replace('Communications Cattenom', 'Communications EDF')

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding='utf-8')

          Path('edf/communications.json').write_text('[]\n', encoding='utf-8')
          Path('edf/guides').mkdir(parents=True, exist_ok=True)
          Path('edf/guides/.gitkeep').write_text('', encoding='utf-8')
          PY
      - name: Commit EDF portal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edf/index.html edf/communications.json edf/guides/.gitkeep
          git commit -m 'Créer le portail Communications EDF et le répertoire guides'
          git push
