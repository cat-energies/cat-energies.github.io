name: Sync Cattenom portal design

on:
  push:
    paths:
      - '.github/workflows/sync-cattenom-portal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy historical portal exactly
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/cat-energies-cattenom/accueil/main/index.html' -o edf/dpn/cattenom/index.html
      - name: Commit exact portal copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edf/dpn/cattenom/index.html
          if git diff --cached --quiet; then
            echo 'No change required'
          else
            git commit -m 'Reprendre strictement le portail Cattenom historique'
            git push
          fi
