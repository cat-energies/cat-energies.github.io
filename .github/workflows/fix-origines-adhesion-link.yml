name: Fix Origines adhesion link

on:
  push:
    paths:
      - '.github/workflows/fix-origines-adhesion-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace only the old adhesion URL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("edf/dpn/cattenom/communiques/09 - Origines CAT Energies.html")
          data = p.read_bytes()
          pattern = rb'https://cat-energies-cattenom\.github\.io/adhesion/[^"\'<>\s]+'
          matches = re.findall(pattern, data)
          print("Old adhesion URLs found:", [m.decode("utf-8", "replace") for m in matches])
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one old adhesion URL, found {len(matches)}")
          new = b"https://cat-energies.github.io/edf/dpn/cattenom/adhesion/Bulletin%20d'adh%C3%A9sion_Cattenom.html"
          p.write_bytes(data.replace(matches[0], new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "edf/dpn/cattenom/communiques/09 - Origines CAT Energies.html"
          git diff --cached --quiet && exit 1
          git commit -m 'Corriger le lien adhésion dans Origines CAT Energies'
          git push
